<article class="product-card">
  <a class="product-card__media" [routerLink]="['/app/products', product.publicId]">
    <img [src]="imageUrl" [alt]="product.name" />
  </a>

  <button
    class="product-card__wishlist"
    type="button"
    aria-label="Dodaj u listu želja"
    [class.product-card__wishlist--active]="isWishlisted"
    (click)="toggleWishlist()"
  >
    {{ isWishlisted ? '♥' : '♡' }}
  </button>

  <a class="product-card__body" [routerLink]="['/app/products', product.publicId]">
    <span class="product-card__category">{{ product.categoryName }}</span>

    <h2>{{ product.name }}</h2>

    <div class="product-card__code">
      {{ product.code }}
    </div>
  </a>

  <section class="product-card__prices">
    @for (tier of visiblePriceTiers; track tier) {
      <div
        class="product-card__price"
        [class.product-card__price--retail]="tier === 'retail'"
        [class.product-card__price--clubMember]="tier === 'clubMember'"
        [class.product-card__price--clubPartner]="tier === 'clubPartner'"
      >
        <span>
          {{ priceTierLabel(tier) }}
          @if (discountForTier(tier) > 0) {
            <small>-{{ discountForTier(tier) }}%</small>
          }
        </span>

        <strong>{{ priceForTier(tier) | rsdCurrency }}</strong>

        <button
          type="button"
          [attr.aria-label]="'Dodaj u korpu - ' + priceTierLabel(tier)"
          (click)="addToCart(tier)"
        >
          🛒
        </button>
      </div>
    }
  </section>
</article>
