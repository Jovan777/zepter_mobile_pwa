<header class="app-header">
  <button class="app-header__menu" type="button" aria-label="Otvori meni" (click)="menuClick.emit()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a class="app-header__logo" routerLink="/app/home" aria-label="Zepter početna">
    <img src="/assets/images/logos/zepter-logo.png" alt="Zepter" />
  </a>

  <div class="app-header__actions">
    <a class="app-header__icon" routerLink="/app/wishlist" aria-label="Lista želja">
      <span class="app-header__icon-symbol">♡</span>

      @if (wishlistCount() > 0) {
        <span class="app-header__badge">{{ wishlistCount() }}</span>
      }
    </a>

    <a class="app-header__icon" routerLink="/app/cart" aria-label="Korpa">
      <span class="app-header__icon-symbol">🛒</span>

      @if (cartCount() > 0) {
        <span class="app-header__badge">{{ cartCount() }}</span>
      }
    </a>
  </div>
</header>
